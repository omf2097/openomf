name: Build MacOS ARM
description: Build MacOS ARM app bundle
runs:
  using: "composite"
  steps:
    - name: Get OpenOMF Version
      uses: ./.github/actions/version

    - name: Install vcpkg
      shell: bash
      run: |
        set -euo pipefail
        git clone https://github.com/microsoft/vcpkg.git .vcpkg
        ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Get openomf assets
      shell: bash
      run: |
        set -euo pipefail
        curl -fL https://www.omf2097.com/pub/files/omf/openomf-assets.zip -o openomf-assets.zip
        rm -rf data
        mkdir data
        unzip -j openomf-assets.zip -d data

    - name: Build macOS app
      shell: bash
      run: |
        set -euo pipefail
        VCPKG_ROOT="${GITHUB_WORKSPACE}/.vcpkg" \
        VCPKG_TARGET_TRIPLET=arm64-osx \
        OPENOMF_BUNDLE_VERSION="${OPENOMF_VERSION}" \
        ./packaging/macos/build-app.sh

    - name: Generate ZIP package
      shell: bash
      run: |
        ditto -c -k --keepParent \
          "dist/macos/OpenOMF.app" \
          "${GITHUB_WORKSPACE}/openomf_${{ env.OPENOMF_VERSION }}_macos14_arm.zip"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openomf_${{ env.OPENOMF_VERSION }}_macos14_arm
        path: openomf_${{ env.OPENOMF_VERSION }}_macos14_arm.zip
        if-no-files-found: error
