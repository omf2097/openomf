name: Build MacOS ARM
description: Build MacOS ARM app bundle
runs:
  using: "composite"
  steps:
    - name: Get OpenOMF Version
      uses: ./.github/actions/version

    - name: Install macOS build tools
      shell: bash
      run: brew install autoconf autoconf-archive automake libtool

    - name: Prepare vcpkg
      uses: johnwason/vcpkg-action@v8
      id: prepare-vcpkg
      with:
        manifest-dir: ${{ github.workspace }}
        triplet: arm64-osx
        revision: 2026.07.29
        token: ${{ github.token }}

    - name: Get openomf assets
      uses: ./.github/actions/assets

    - name: Extract openomf assets
      shell: bash
      run: |
        set -euo pipefail
        rm -rf data
        mkdir data
        unzip -j openomf-assets.zip -d data

    - name: Get openomf mods
      uses: ./.github/actions/fetch_mods

    - name: Extract openomf mods
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p data/mods
        unzip -o openomf-mods.zip -d data/mods

    - name: Build macOS app
      shell: bash
      run: |
        set -euo pipefail
        VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg" \
        VCPKG_TARGET_TRIPLET=arm64-osx \
        OPENOMF_BUNDLE_VERSION="${OPENOMF_VERSION}" \
        ./packaging/macos/build-app.sh

    - name: Generate ZIP package
      shell: bash
      run: |
        ditto -c -k --keepParent \
          "dist/macos/OpenOMF.app" \
          "${GITHUB_WORKSPACE}/openomf_${{ env.OPENOMF_VERSION }}_macos14_arm.zip"

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openomf_${{ env.OPENOMF_VERSION }}_macos14_arm
        path: openomf_${{ env.OPENOMF_VERSION }}_macos14_arm.zip
        if-no-files-found: error
