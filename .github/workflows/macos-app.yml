name: macOS App Bundle

on:
  push:
    branches:
      - master
      - main
  workflow_run:
    workflows:
      - Sync Upstream
    types:
      - completed
  workflow_dispatch:
    inputs:
      bundle_id:
        type: string
        description: macOS bundle identifier
        default: ai.badcommand.omf2097
      app_name:
        type: string
        description: App bundle name
        default: OpenOMF
      codesign_identity:
        type: string
        description: Codesign identity name or SHA-1. Leave blank for ad-hoc signing.
        required: false
      notarize:
        type: boolean
        description: Submit to Apple notarization and staple the result
        default: false

jobs:
  build:
    name: Build macOS app
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-14
    env:
      OPENOMF_WORKFLOW_APP_NAME: ${{ inputs.app_name || 'OpenOMF' }}
      OPENOMF_WORKFLOW_BUNDLE_ID: ${{ inputs.bundle_id || 'ai.badcommand.omf2097' }}
    steps:
      - uses: actions/checkout@v6

      - name: Import Developer ID certificate
        if: ${{ inputs.codesign_identity != '' && inputs.codesign_identity != null }}
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" || -z "${MACOS_CERTIFICATE_PASSWORD}" || -z "${MACOS_KEYCHAIN_PASSWORD}" ]]; then
            echo "Developer ID signing requires MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD, and MACOS_KEYCHAIN_PASSWORD secrets." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg.git .vcpkg
          ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Download game assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://www.omf2097.com/pub/files/omf/openomf-assets.zip -o openomf-assets.zip
          rm -rf data
          mkdir data
          unzip -j openomf-assets.zip -d data

      - name: Build app bundle
        env:
          OPENOMF_APP_NAME: ${{ env.OPENOMF_WORKFLOW_APP_NAME }}
          OPENOMF_BUNDLE_ID: ${{ env.OPENOMF_WORKFLOW_BUNDLE_ID }}
          OPENOMF_CODESIGN_IDENTITY: ${{ inputs.codesign_identity }}
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        shell: bash
        run: ./packaging/macos/build-app.sh

      - name: Create notarization ZIP
        if: ${{ inputs.notarize }}
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}.app" "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}-notary.zip"

      - name: Notarize app
        if: ${{ inputs.notarize }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NOTARY_APPLE_ID}" || -z "${NOTARY_PASSWORD}" || -z "${NOTARY_TEAM_ID}" ]]; then
            echo "Notarization requires NOTARY_APPLE_ID, NOTARY_PASSWORD, and NOTARY_TEAM_ID secrets." >&2
            exit 1
          fi
          xcrun notarytool submit "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}-notary.zip" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}.app"
          spctl --assess --type execute --verbose=4 "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}.app"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}.app" "dist/macos/${OPENOMF_WORKFLOW_APP_NAME}-macos-arm64.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OPENOMF_WORKFLOW_APP_NAME }}-macos-arm64
          path: dist/macos/${{ env.OPENOMF_WORKFLOW_APP_NAME }}-macos-arm64.zip
          if-no-files-found: error
