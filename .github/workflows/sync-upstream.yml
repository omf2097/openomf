name: Sync Upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        type: string
        description: Upstream owner/repository
        default: omf2097/openomf
      upstream_branch:
        type: string
        description: Upstream branch to merge
        default: master
      target_branch:
        type: string
        description: Fork branch to update
        default: master
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch || 'master' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'omf2097/openomf' }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Merge upstream
        id: merge
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          after="$(git rev-parse HEAD)"
          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fork branch
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch || 'master' }}
        run: git push origin "HEAD:${TARGET_BRANCH}"
