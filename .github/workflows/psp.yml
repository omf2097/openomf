name: PSP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/psp.yml'
      - 'CMakeLists.txt'
      - 'cmake-scripts/**'
      - 'packaging/psp/**'
      - 'src/**'
      - 'tools/languagetool/**'

jobs:
  psp:
    name: PSP
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/pspdev/pspdev:v20261001
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        run: apk add --no-cache build-base ninja curl unzip zip tar sdl2-dev pkgconf enet-dev libxmp-dev opusfile-dev libpng-dev
      - name: Trust checkout in build container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Get OpenOMF assets
        uses: ./.github/actions/assets
      - name: Get OpenOMF icons
        uses: ./.github/actions/assets
        with:
          asset_url: 'https://www.omf2097.com/pub/files/omf/openomf-icons.zip'
          filename: 'openomf-icons.zip'
      - name: Configure host languages
        run: |
          cmake -S . -B build/host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_MINIUPNPC=OFF -DUSE_NATPMP=OFF \
            -DUSE_CONFUSE=OFF -DUSE_ZIP=OFF -DENABLE_MODMANAGER=OFF \
            -DOMF_AUDIO_BACKENDS=null -DOMF_VIDEO_RENDERERS=null
      - name: Build host languages
        run: cmake --build build/host --target build_languages --parallel "$(nproc)"
      - name: Prepare PSP icon
        run: |
          mkdir -p build/psp
          unzip -p openomf-icons.zip omf-logo/omf-144x80.png > build/psp/icon0.png
          test -s build/psp/icon0.png
      - name: Configure
        run: |
          psp-cmake -S . -B build/psp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_MINIUPNPC=OFF \
            -DUSE_NATPMP=OFF \
            -DUSE_ARGTABLE=OFF \
            -DUSE_CONFUSE=OFF \
            -DUSE_ZIP=OFF \
            -DENABLE_MODMANAGER=OFF \
            -DBUILD_LANGUAGES=OFF \
            -DOMF_AUDIO_BACKENDS=sdl \
            -DOMF_VIDEO_RENDERERS=null \
            -DOMF_STRIP_GNU_BINARIES=OFF
      - name: Build
        run: cmake --build build/psp --parallel "$(nproc)"
      - name: Package PSP game
        run: OMF_ASSET_ARCHIVE="$GITHUB_WORKSPACE/openomf-assets.zip" sh packaging/psp/package.sh build/psp build/host/resources
      - name: Upload PSP game
        uses: actions/upload-artifact@v7
        with:
          name: openomf-psp
          path: build/psp/openomf-psp.zip
          archive: false
          if-no-files-found: error
